# Dataset generalization: CUB-200 with a pinned ImageNet-1K ResNet-18, d=128.
# SGD lr 0.01, momentum 0.9, wd 1e-4, 5-epoch warmup, 100 epochs, cosine.
include: base/cifar_resnet18.yaml

experiment:
  name: cub200_benchmark

cache_dir: artifacts/cache/cub200

data:
  dataset: cub200
  root: data
  split_manifest: artifacts/splits/cub200.json
  split_seed: 12345
  validation_fraction: 0.10
  sealed_test: true

model:
  embedding_dim: 128
  pretrained: true
  pretrained_weights: IMAGENET1K_V1

pilot:
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0001

training:
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0001

study:
  fixed_shell_counts: none
  run_auto_k: true
  controls: []
  baselines: all
  external_baselines: [hyperspacex_matched]
  seeds: [0, 1, 2, 3, 4]
