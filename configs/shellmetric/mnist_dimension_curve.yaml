# MNIST dimension curve (rehearsal cell): every method of the primary MNIST
# study at d in {2, 3, 32, 128, 512, 1024}. That is ShellMetric FixedS(1..4),
# AutoK, and its shuffled-confusion and no-shell-loss controls, plus all eight
# in-repository baselines. It shares base/mnist_resnet18.yaml and its cache
# with mnist_rehearsal_primary.yaml, so the pilot, the shell plans, and every
# d=3 job are reused from that run; --dry-run lists what is new. ResNet-18
# features are 512-D, so the d=1024 embedding spans at most 512 directions.
include: base/mnist_resnet18.yaml

experiment:
  name: mnist_dimension_curve

study:
  rehearsal: true
  fixed_shell_counts: compact
  ensure_one_shell_control: true
  run_auto_k: true
  controls: [shuffled_confusion, no_shell_loss]
  embedding_dims: [2, 3, 32, 128, 512, 1024]
  baselines: all
  seeds: [0, 1, 2]
