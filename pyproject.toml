[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellmetric"
version = "1.0.0"
description = "Prototype-free supervised multi-shell metric learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research use" }
authors = [{ name = "ShellMetric contributors" }]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
reporting = [
  "pandas>=2.1",
]

[project.scripts]
shellmetric-study = "multishell.shellmetric.runner:main"
shellmetric-summarize = "multishell.summarize:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".cache",
  ".conda",
  ".research-cache-hyperspacex",
  ".tmp",
  "01_mnist_experiment.ipynb",
  "artifacts",
  "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
